[package]
name = "rusty-gb"
version = "0.1.0"
edition = "2021"

# Shared by every target. The emulator core (cpu, bus, ppu, fetcher, mbc,
# memory, rom) depends on nothing beyond these two plus `alloc`.
[dependencies]
bitfield = "0.19.1"
bytesize = { version = "2.0.1", default-features = false }

# Host build (`cargo build`, `cargo test`).
#
# `target_os = "none"` is what splits the two worlds: the Pico target
# thumbv8m.main-none-eabihf reports "none", every host target reports macos /
# linux / windows. Selecting on that rather than on a feature flag means
# neither build needs a remembered `--features` to be correct.
[target.'cfg(not(target_os = "none"))'.dependencies]
pixels = "0.15.0"
winit = "0.29.15"
ratatui = "0.29.0"
colored = "3.0.0"
once_cell = "1.19.0"
peak_alloc = "0.2.0"

# Pico 2 / RP2350 build (`cargo build --target thumbv8m.main-none-eabihf`).
[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
critical-section = "1.2.0"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embedded-alloc = "0.5.1"
panic-halt = "0.2.0"
rp235x-hal = { version = "0.3.0", features = ["binary-info", "critical-section-impl", "rt", "defmt"] }
# USB CDC, so the FPS readout and the Game Boy serial port reach a host
# terminal over the same cable that powers the board -- no debug probe, which
# is what reading the defmt/RTT buffer would otherwise require.
usb-device = "0.3.2"
usbd-serial = "0.2.2"

# Only the restored cpu.rs unit tests use this, and those are host-only.
[dev-dependencies]
rand = "0.9.0-alpha.1"

# Hand-rolled: `cargo bench`'s own harness is nightly-only, and what the
# throughput benchmark needs -- fixed emulated work, best-of-N, a saved
# baseline -- is shorter than a statistics dependency would be. Host-only in
# practice; `cargo bench` does not run for the Pico target.
[[bench]]
name = "throughput"
harness = false

[profile.dev]
overflow-checks = true

[profile.release]
debug = true
opt-level = 3
# Cross-crate inlining matters much more once a HAL is in the build than it
# does for a single-crate host binary, and on a flash-executing target every
# byte of code competes for the 16 KiB XIP cache.
lto = "fat"
codegen-units = 1

# For the RP2350. Kept separate from `release` so that `cargo test --release`
# keeps unwinding, which `undefined_opcodes_still_panic` needs.
[profile.embedded]
inherits = "release"
panic = "abort"
debug = false
