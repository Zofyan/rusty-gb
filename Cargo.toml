[package]
name = "rusty-gb"
version = "0.1.0"
edition = "2021"

[dependencies]
bitfield = "0.17.0"
rand = "0.9.0-alpha.1"
macroquad = "0.4.14"
gilrs = "0.11.0"
bytesize = "1.3.0"
colored = "3.0.0"
ratatui = "0.29.0"
clap = { version = "4.5.38", features = ["derive"] }
once_cell = "1.19.0"
async-trait = "0.1.88"
pixels = "0.15.0"
winit = "0.29.15"
peak_alloc = "0.2.0"
cloneable-file = "0.1.1"

[profile.dev]
overflow-checks = true

[profile.release]
debug = true
opt-level = 3
# Cross-crate inlining matters much more once a HAL is in the build than it
# does for a single-crate host binary, and on a flash-executing target every
# byte of code competes for the 16 KiB XIP cache.
lto = "fat"
codegen-units = 1

# For the RP2350. Kept separate from `release` so that `cargo test --release`
# keeps unwinding, which `undefined_opcodes_still_panic` needs.
[profile.embedded]
inherits = "release"
panic = "abort"
debug = false
