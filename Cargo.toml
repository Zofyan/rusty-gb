[package]
name = "rusty-gb"
version = "0.1.0"
edition = "2021"

# `cargo bench` runs every target that opts into benchmarking, not just the
# `[[bench]]` one. The lib and the bin have no benchmarks in them, but they are
# still built against libtest and run with whatever follows `--` -- so
# `cargo bench -- --save main` reached libtest first and died on "Unrecognized
# option: 'save'" before the real benchmark was ever started. Opting them out
# leaves `benches/throughput.rs` as the only thing `cargo bench` runs, which is
# what the flags in its `--help` were written for.
#
# This has no effect on `cargo test`; both targets still run their tests.
[lib]
bench = false

[[bin]]
name = "rusty-gb"
path = "src/main.rs"
bench = false

# Shared by every target. The emulator core (cpu, bus, ppu, fetcher, mbc,
# memory, rom) depends on nothing beyond these two plus `alloc`.
[dependencies]
bitfield = "0.19.1"
bytesize = { version = "2.0.1", default-features = false }

# Host build (`cargo build`, `cargo test`).
#
# `target_os = "none"` is what splits the two worlds: the Pico target
# thumbv8m.main-none-eabihf reports "none", every host target reports macos /
# linux / windows. Selecting on that rather than on a feature flag means
# neither build needs a remembered `--features` to be correct.
[target.'cfg(not(target_os = "none"))'.dependencies]
pixels = "0.15.0"
winit = "0.29.15"
ratatui = "0.29.0"
colored = "3.0.0"
once_cell = "1.19.0"
peak_alloc = "0.2.0"

# Shared by both Pico builds. Everything here is board-agnostic: the HAL is
# what differs, and it is selected by triple below.
[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
critical-section = "1.2.0"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embedded-alloc = "0.5.1"
panic-halt = "0.2.0"
mipidsi = "0.10.0"
static_cell = "2.1.1"
embedded-hal-bus = "0.3.0"
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
# USB CDC, so the FPS readout and the Game Boy serial port reach a host
# terminal over the same cable that powers the board -- no debug probe, which
# is what reading the defmt/RTT buffer would otherwise require.
usb-device = "0.3.2"
usbd-serial = "0.2.2"

# Pico 2 / RP2350 (`cargo build --target thumbv8m.main-none-eabihf`).
#
# The triple is quoted because it contains a dot, which is a table separator in
# TOML: unquoted, this would be `target.thumbv8m.main-none-eabihf` -- three
# nested tables and no such platform.
[target."thumbv8m.main-none-eabihf".dependencies]
rp235x-hal = { version = "0.3.0", features = ["binary-info", "critical-section-impl", "rt", "defmt"] }

# Pico 1 / W / WH -- RP2040 (`cargo build --target thumbv6m-none-eabi`).
[target.thumbv6m-none-eabi.dependencies]
# No `binary-info`: nothing in `src/` emits a binary-info entry, and asking for
# it would mean carrying the matching linker section in `memory/rp2040.x` for
# an empty table. `rp2040-e5` works around the erratum that otherwise makes USB
# device enumeration intermittent, which for this board is the only diagnostic
# channel there is.
rp2040-hal = { version = "0.12.0", features = ["critical-section-impl", "rt", "defmt", "rp2040-e5"] }
# The 256-byte second-stage bootloader the RP2040's bootrom expects at the
# start of flash, checksum included. See `memory/rp2040.x`.
rp2040-boot2 = "0.3.0"
# Cortex-M0+ has load/store atomics but no compare-and-swap, so crates that
# need CAS -- `static_cell` here -- get it from `portable-atomic`, which
# emulates it with a critical section. This is a no-op on the M33.
portable-atomic = { version = "1.11.0", default-features = false, features = ["critical-section"] }

# Only the restored cpu.rs unit tests use this, and those are host-only.
[dev-dependencies]
rand = "0.9.0-alpha.1"

# Hand-rolled: `cargo bench`'s own harness is nightly-only, and what the
# throughput benchmark needs -- fixed emulated work, best-of-N, a saved
# baseline -- is shorter than a statistics dependency would be. Host-only in
# practice; `cargo bench` does not run for the Pico target.
[[bench]]
name = "throughput"
harness = false

[profile.dev]
overflow-checks = true

[profile.release]
debug = true
opt-level = 3
# Cross-crate inlining matters much more once a HAL is in the build than it
# does for a single-crate host binary, and on a flash-executing target every
# byte of code competes for the 16 KiB XIP cache.
lto = "fat"
codegen-units = 1

# For the RP2350. Kept separate from `release` so that `cargo test --release`
# keeps unwinding, which `undefined_opcodes_still_panic` needs.
[profile.embedded]
inherits = "release"
panic = "abort"
debug = false
